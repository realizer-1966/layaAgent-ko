name: 테스트 후 GitHub Pages 배포

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 단위 테스트 (도구·추출·게이트·에이전트 루프·지표·과제 세트)
        run: npm test

      # 모델은 저장소에 넣지 않는다: System 1은 convaiinnovations/laya-multilingual의 GitHub Pages 미러에서,
      # System 2(WebLLM)는 MLC 모델 저장소에서 스트리밍하므로 사이트는 약 37MB로 유지된다.
      - name: 사이트 조립
        run: node scripts/prepare_site.mjs

      - name: 모델 저장소 접근 확인
        run: curl -fsSL https://realizer-1966.github.io/laya-web-ko/model-multilingual/manifest.json | head -c 200

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
